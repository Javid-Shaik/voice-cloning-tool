"""
Training configuration for emotion-aware voice cloning
"""

# Model Architecture
model:
  input_dim: 256
  hidden_dim: 512
  emotion_dim: 3
  num_layers: 4
  dropout: 0.1
  bidirectional: true

# Training Parameters
training:
  batch_size: 32
  learning_rate: 0.0001
  num_epochs: 100
  warmup_epochs: 5
  grad_clip: 1.0
  
  # Loss weights
  loss_weights:
    reconstruction: 1.0
    emotion: 0.5
    prosody: 0.3
    context: 0.2
    
  # Optimizer
  optimizer:
    type: "adam"
    beta1: 0.9
    beta2: 0.999
    weight_decay: 0.0001
    
  # Learning rate scheduler
  lr_scheduler:
    type: "cosine"
    T_max: 100
    eta_min: 0.000001

# Data Loading
data:
  num_workers: 4
  pin_memory: true
  prefetch_factor: 2
  
  # Dataset paths
  train_data: "data/processed/train"
  val_data: "data/processed/val"
  test_data: "data/processed/test"
  
  # Audio parameters
  sample_rate: 22050
  n_fft: 1024
  hop_length: 256
  win_length: 1024
  n_mels: 80
  
  # Text parameters
  max_text_length: 200
  
  # Augmentation
  augmentation:
    enabled: true
    pitch_shift: [-2, 2]
    time_stretch: [0.9, 1.1]
    volume: [0.8, 1.2]

# Checkpointing
checkpoint:
  save_dir: "checkpoints"
  save_frequency: 10
  keep_last_k: 5
  
# Logging
logging:
  log_dir: "logs"
  tensorboard: true
  wandb:
    enabled: true
    project: "emotion-voice-clone"
    
# Evaluation
evaluation:
  batch_size: 16
  metrics:
    - "mel_cepstral_distortion"
    - "f0_rmse"
    - "emotion_accuracy"
    - "speaker_similarity"
    
# Environment
environment:
  seed: 42
  deterministic: true
  benchmark: true
  cudnn_enabled: true